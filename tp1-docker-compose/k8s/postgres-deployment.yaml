# Deployment : lance la base PostgreSQL.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  # Une seule instance utilise le volume ReadWriteOnce.
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        # Injecte les variables du Secret dans le conteneur.
        envFrom:
        - secretRef:
            name: postgres-credentials
        volumeMounts:
        - name: data
          # Donnees PostgreSQL conservees dans le PVC.
          mountPath: /var/lib/postgresql/data
        - name: init
          # Monte le script SQL fourni par le ConfigMap.
          mountPath: /docker-entrypoint-initdb.d/init.sql
          subPath: init.sql
          readOnly: true
        readinessProbe:
          # Le Pod est pret quand PostgreSQL accepte les connexions.
          exec:
            command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          # Redemarre PostgreSQL s'il ne repond plus.
          exec:
            command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
          initialDelaySeconds: 15
          periodSeconds: 10
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: postgres-data
      - name: init
        configMap:
          name: postgres-init