# Deployment : gere le reverse proxy Nginx.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
spec:
  # Le selector relie le Deployment a ses Pods.
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
        volumeMounts:
        - name: config
          # subPath monte seulement le fichier default.conf.
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
          readOnly: true
        readinessProbe:
          # Nginx recoit du trafic seulement quand ce endpoint repond.
          httpGet:
            path: /nginx-status
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 5
      volumes:
      - name: config
        configMap:
          name: nginx-config